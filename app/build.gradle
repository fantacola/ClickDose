plugins { id 'com.android.application' }

android { namespace 'com.clickplan.app'; compileSdk 35
    defaultConfig { applicationId 'com.clickplan.app'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0.0' }

    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
